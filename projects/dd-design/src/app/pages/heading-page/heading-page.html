<section class="page">
  <dd-card>
    <dd-tabs>
      <dd-tab id="showcase" label="Showcase">
        <h2>Heading</h2>
        <p>Semantic heading elements h1–h6 with typography scale.</p>

        <dd-heading [level]="1">Heading Level 1</dd-heading>
        <dd-heading [level]="2">Heading Level 2</dd-heading>
        <dd-heading [level]="3">Heading Level 3</dd-heading>
        <dd-heading [level]="4">Heading Level 4</dd-heading>
        <dd-heading [level]="5">Heading Level 5</dd-heading>
        <dd-heading [level]="6">Heading Level 6</dd-heading>

        <h3>Muted variant</h3>
        <dd-heading [level]="2" [muted]="true">Muted Heading</dd-heading>
      </dd-tab>

      <dd-tab id="api" label="API">
        <h3>Inputs</h3>
        <ul>
          <li><code>level: 1 | 2 | 3 | 4 | 5 | 6</code></li>
          <li><code>muted: boolean</code></li>
        </ul>
      </dd-tab>
    </dd-tabs>
  </dd-card>
</section>
