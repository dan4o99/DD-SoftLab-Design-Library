<section class="page">
  <dd-card>
    <dd-tabs>
      <dd-tab id="showcase" label="Showcase">
        <h2>Progress Indicator</h2>
        <p>Show the user's progress through a multi-step workflow.</p>

        <dd-progress-indicator [steps]="steps" [currentStep]="currentStep()" />

        <div style="display: flex; gap: 0.5rem; margin-top: 1rem">
          <dd-button variant="secondary" (click)="prev()">← Back</dd-button>
          <dd-button (click)="next()">Next →</dd-button>
        </div>
        <p>Step {{ currentStep() }} of {{ steps.length }}</p>
      </dd-tab>

      <dd-tab id="api" label="API">
        <h3>Inputs</h3>
        <ul>
          <li>
            <code>steps: DdProgressStep[]</code> — array of
            <code>&#123; label: string &#125;</code>
          </li>
          <li>
            <code>currentStep: number</code> — 1-based index of the active step
          </li>
        </ul>
      </dd-tab>
    </dd-tabs>
  </dd-card>
</section>
