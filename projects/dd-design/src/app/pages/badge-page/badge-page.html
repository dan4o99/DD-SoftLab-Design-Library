<section class="page">
  <dd-card>
    <dd-tabs>
      <dd-tab id="showcase" label="Showcase">
        <h2>Badge</h2>
        <p>Small labels for status, tags, or metadata.</p>

        <div class="row">
          <dd-badge>Default</dd-badge>
          <dd-badge variant="primary">Primary</dd-badge>
          <dd-badge variant="success">Success</dd-badge>
          <dd-badge variant="warning">Warning</dd-badge>
          <dd-badge variant="danger">Danger</dd-badge>
        </div>
      </dd-tab>

      <dd-tab id="api" label="API">
        <h3>Inputs</h3>
        <ul>
          <li>variant: default | primary | success | warning | danger</li>
          <li>customClass</li>
        </ul>
      </dd-tab>
    </dd-tabs>
  </dd-card>
</section>
