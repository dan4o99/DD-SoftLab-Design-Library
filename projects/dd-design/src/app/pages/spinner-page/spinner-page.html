<section class="page">
  <dd-card>
    <dd-tabs>
      <dd-tab id="showcase" label="Showcase">
        <h2>Spinner</h2>
        <p>A loading indicator showing a background process is in progress.</p>

        <div class="row" style="align-items: center">
          <dd-spinner size="small" ariaLabel="Loading small" />
          <dd-spinner size="medium" ariaLabel="Loading medium" />
          <dd-spinner size="large" ariaLabel="Loading large" />
        </div>
      </dd-tab>

      <dd-tab id="api" label="API">
        <h3>Inputs</h3>
        <ul>
          <li>size: small | medium | large</li>
          <li>ariaLabel, customClass</li>
        </ul>
      </dd-tab>
    </dd-tabs>
  </dd-card>
</section>
