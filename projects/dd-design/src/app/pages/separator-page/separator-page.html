<section class="page">
  <dd-card>
    <dd-tabs>
      <dd-tab id="showcase" label="Showcase">
        <h2>Separator</h2>
        <p>A visual divider between sections of content.</p>

        <h3>Horizontal</h3>
        <p>Content above</p>
        <dd-separator />
        <p>Content below</p>

        <h3>Vertical</h3>
        <div class="row" style="align-items: center">
          <span>Left</span>
          <dd-separator orientation="vertical" />
          <span>Right</span>
        </div>
      </dd-tab>

      <dd-tab id="api" label="API">
        <h3>Inputs</h3>
        <ul>
          <li>orientation: horizontal | vertical</li>
          <li>customClass</li>
        </ul>
      </dd-tab>
    </dd-tabs>
  </dd-card>
</section>
